    <script>
      (function () {
        try {
          var pref = localStorage.getItem('gki_efata_theme_pref_v1');
          if (!pref && localStorage.getItem('gki_efata_dark_mode') === 'true') {
            pref = 'dark';
          }
          var isDark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', isDark ? '#180D07' : '#9A3412');
        } catch (e) {}
      })();
    </script>
